<!doctype html>
<html lang="et">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hobujaama busside väljumised</title>
  <style>
    :root { color-scheme: light; --ink:#17324d; --muted:#64748b; --paper:#f4f7fb; --line:#e4eaf1; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; background:var(--paper); color:var(--ink); font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; }
    main { width:min(100%,620px); }
    h1 { margin:0 0 6px; font-size:clamp(1.6rem,5vw,2.25rem); letter-spacing:-.03em; }
    .sub { margin:0 0 22px; color:var(--muted); }
    .card { background:white; border:1px solid var(--line); border-radius:18px; padding:20px 22px; margin:12px 0; box-shadow:0 8px 28px #17324d0b; }
    .route { display:flex; justify-content:space-between; gap:12px; align-items:center; }
    .line { font-weight:750; font-size:1.12rem; }
    .direction { color:var(--muted); }
    .time { margin-top:12px; font-size:1.45rem; font-weight:750; }
    .time span { font-size:1rem; font-weight:550; color:#42627f; }
    footer { margin-top:20px; color:var(--muted); font-size:.88rem; }
    a { color:#1769aa; }
    @media (max-width:420px) { body{padding:16px}.card{padding:17px}.route{align-items:flex-start;flex-direction:column;gap:2px} }
  </style>
</head>
<body>
  <main>
    <h1>Hobujaama väljumised</h1>
    <p class="sub">Suunaga Lasnamäe poole · reaalaja vaade 20.11.2026 kell 19.00</p>
    <section class="card" aria-label="Buss 60 Seli suunal">
      <div class="route"><div class="line">Buss 60</div><div class="direction">Seli suunal</div></div>
      <div class="time">19.12 <span>väljumine</span> <span>· Katleri 19.24</span></div>
    </section>
    <section class="card" aria-label="Buss 63 Priisle suunal">
      <div class="route"><div class="line">Buss 63</div><div class="direction">Priisle suunal</div></div>
      <div class="time">19.04 <span>väljumine</span> <span>· Katleri 19.16</span></div>
    </section>
    <footer>
      Väljumisajad on reaalajas vaadatud seisuga; liiklusolud võivad neid muuta.<br>
      <a href="https://transport.tallinn.ee/#bus/60/b-a/12211-2">Buss 60</a> ·
      <a href="https://transport.tallinn.ee/#bus/63/b-a/12211-2">Buss 63</a>
    </footer>
  </main>
</body>
</html>
